<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northstar Stock Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10151b;
    --panel: #1a222b;
    --panel-raised: #212b36;
    --line: #2c3644;
    --text: #e8edf3;
    --text-dim: #8a97a6;
    --amber: #f5a623;
    --green: #3ddc97;
    --green-dim: #1f4d3a;
    --amber-dim: #6b5326;
    --red: #ef5b5b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 32px 20px 60px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
  .brand-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--amber); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 30px; }
  .beacon { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .beacon-text .mode { color: var(--text); font-weight: 500; }
  .beacon-text .detail { color: var(--text-dim); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; margin-bottom: 20px; }
  .card-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
  .search-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .search-row input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 11px 14px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
  .search-row input:focus { outline: 2px solid var(--amber); outline-offset: -1px; }
  .search-row button { background: var(--amber); color: #1a1206; border: none; border-radius: 6px; padding: 0 20px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .search-row button:hover { filter: brightness(1.08); }
  .result { display: flex; justify-content: space-between; align-items: center; background: var(--panel-raised); border-radius: 6px; padding: 16px 18px; }
  .result .sku { font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
  .result .name { font-size: 15px; font-weight: 500; }
  .stock-pill { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 20px; }
  .stock-pill.in { background: var(--green-dim); color: var(--green); }
  .stock-pill.low { background: var(--amber-dim); color: var(--amber); }
  .stock-pill.out { background: #4a2323; color: var(--red); }
  .log-list { display: flex; flex-direction: column; max-height: 220px; overflow-y: auto; }
  .log-entry { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .log-entry:last-child { border-bottom: none; }
  .log-time { color: var(--text-dim); flex-shrink: 0; width: 68px; }
  .log-tag { flex-shrink: 0; width: 68px; font-weight: 600; }
  .log-tag.poll { color: var(--amber); }
  .log-tag.hook { color: var(--green); }
  .log-msg { color: var(--text); }
  footer { margin-top: 28px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <div class="brand-label">Northstar Retail Co. — Sprint 2</div>
      <h1>Stock Sync Service</h1>
    </div>
    <div class="beacon">
      <div class="dot" id="beaconDot"></div>
      <div class="beacon-text">
        <div class="mode">WEBHOOK</div>
        <div class="detail">listening for pushes</div>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="card-label">Query Endpoint — GET /stock/&lt;sku&gt;</div>
    <div class="search-row">
      <input type="text" id="skuInput" placeholder="Enter SKU, e.g. NR-1042" value="NR-1042" />
      <button onclick="lookupStock()">Check Stock</button>
    </div>
    <div class="result" id="resultBox">
      <div><div class="sku">—</div><div class="name">Search a SKU above</div></div>
      <div class="stock-pill in" id="stockPill">—</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Simulate Incoming Webhook (stands in for the vendor's push)</div>
    <div class="search-row">
      <input type="text" id="pushSku" placeholder="SKU, e.g. NR-1042" value="NR-1042" style="max-width:140px" />
      <input type="text" id="pushName" placeholder="Product name" value="Cast Iron Skillet, 10 inch" />
      <input type="number" id="pushStock" placeholder="Stock" value="24" style="max-width:90px" />
      <button onclick="simulateWebhook()">Push Update</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Query Log</div>
    <div class="log-list" id="logList"></div>
  </div>

  <footer>Live data from your Flask server — this is NOT mock data</footer>

</div>

<script>
  // This talks to YOUR real Flask server, not fake data.
  // Change this if your server runs on a different port.
  const API_BASE = "http://localhost:8000";

  function pillFor(stock) {
    if (stock === 0) return { cls: "out", label: "Out of stock" };
    if (stock <= 5) return { cls: "low", label: stock + " left — low stock" };
    return { cls: "in", label: stock + " in stock" };
  }

  function logEvent(tagClass, tagText, msg) {
    const list = document.getElementById("logList");
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const row = document.createElement("div");
    row.className = "log-entry";
    row.innerHTML = `
      <div class="log-time">${time}</div>
      <div class="log-tag ${tagClass}">${tagText}</div>
      <div class="log-msg">${msg}</div>
    `;
    list.prepend(row);
  }

  // This is the real connection: fetch calls YOUR Flask /stock/<sku> route
  async function lookupStock() {
    const sku = document.getElementById("skuInput").value.trim().toUpperCase();
    const box = document.getElementById("resultBox");

    try {
      let response = await fetch(`${API_BASE}/stock/${sku}`);
      let data = await response.json();

      if (data.error) {
        box.innerHTML = `<div><div class="sku">${sku}</div><div class="name">Not found in cache</div></div>`;
        logEvent("poll", "MISS", `Queried ${sku} — not found.`);
        return;
      }

      const p = pillFor(data.stock);
      box.innerHTML = `
        <div>
          <div class="sku">${sku}</div>
          <div class="name">${data.name}</div>
        </div>
        <div class="stock-pill ${p.cls}">${p.label}</div>
      `;
      logEvent("hook", "QUERY", `Fetched ${sku} from live server — stock: ${data.stock}.`);
    } catch (err) {
      box.innerHTML = `<div><div class="sku">${sku}</div><div class="name">Server unreachable — is Flask running?</div></div>`;
      logEvent("poll", "ERROR", `Could not reach ${API_BASE}. Is server.py running?`);
    }
  }

  // Sends a fake webhook push, same as manually running fetch() in dev tools,
  // but now triggered by a button instead of typing code every time.
  async function simulateWebhook() {
    const sku = document.getElementById("pushSku").value.trim().toUpperCase();
    const name = document.getElementById("pushName").value.trim();
    const stock = parseInt(document.getElementById("pushStock").value, 10);

    if (!sku || !name || isNaN(stock)) {
      logEvent("poll", "ERROR", "Fill in SKU, name, and stock before pushing.");
      return;
    }

    try {
      let response = await fetch(`${API_BASE}/webhook/stock-update`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sku, name, stock })
      });
      let data = await response.json();
      logEvent("hook", "PUSH", `${sku} — ${name} pushed with stock ${stock}. Server says: ${data.status}.`);
    } catch (err) {
      logEvent("poll", "ERROR", `Push failed — is server.py running at ${API_BASE}?`);
    }
  }

  logEvent("hook", "BOOT", "Dashboard loaded — connect to your running Flask server.");
</script>

</body>
</html>
